name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate extension
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Check icons are up to date
        run: |
          python3 scripts/make-icons.py
          if ! git diff --quiet -- icons; then
            echo "::error::icons/ is out of date with scripts/make-icons.py — run 'npm run icons' and commit."
            git --no-pager diff --stat -- icons
            exit 1
          fi

      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $MANIFEST_VERSION"
            exit 1
          fi
          echo "Tag and manifest agree on $MANIFEST_VERSION"

      - name: Package
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wtrl-zrl-team-report
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
          body: |
            ## Install

            1. Download the `.zip` below and unzip it.
            2. Open `chrome://extensions` and turn on **Developer mode** (top right).
            3. Click **Load unpacked** and select the unzipped folder.
            4. Go to <https://www.wtrl.racing/zrl/myteams/> and click the **Report** button.

            Chrome will not auto-update an unpacked extension — repeat these steps to upgrade.
