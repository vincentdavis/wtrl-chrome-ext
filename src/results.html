<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WTRL Team Report — Table</title>
    <link rel="stylesheet" href="pages.css" />
    <link rel="stylesheet" href="results.css" />
  </head>
  <body class="results">
    <header>
      <img src="../icons/icon48.png" alt="" />
      <h1>Team Report</h1>
      <span class="meta" id="generatedAt"></span>
      <div class="header-actions">
        <button id="exportCsv" title="Export the rows currently shown, filters and sort included">
          Export view (CSV)
        </button>
        <button id="enrich" title="Add ZwiftPower category, rank and power to every rider">
          Add ZwiftPower
        </button>
        <button id="enrichZr" title="Add ZwiftRacing vELO and factors — one request per rider">
          Add ZwiftRacing
        </button>
        <button id="refresh" class="primary" title="Re-read every team from WTRL">Refresh</button>
      </div>
    </header>

    <div id="navHost"></div>

    <main>
      <div class="note error" id="empty" hidden>
        No report stored yet. Open your WTRL My Teams page and press
        <strong>Report</strong> to build one.
      </div>

      <div class="note warn" id="partial" hidden>
        <span id="partialText"></span>
        <button id="retryFailed" class="inline-btn">Retry failed teams</button>
      </div>
      <div class="note" id="refreshStatus" hidden></div>

      <div class="live" id="live" hidden>
        <span id="liveText"></span>
        <div class="live-bar"><div class="live-bar-fill" id="liveFill"></div></div>
      </div>

      <!-- Clicking a tile applies it as a filter. -->
      <section class="tiles" id="tiles"></section>

      <section class="toolbar">
        <input type="search" id="search" placeholder="Search name, Zwift id or user id…" autocomplete="off" />

        <select id="teamFilter" aria-label="Team"></select>

        <select id="statusFilter" aria-label="Membership status">
          <option value="">All statuses</option>
          <option value="MEMBER">Members</option>
          <option value="INVITED">Invited — not accepted</option>
        </select>

        <select id="signupFilter" aria-label="Sign-up state">
          <option value="">Signed up: any</option>
          <option value="yes">Signed up</option>
          <option value="no">Not signed up</option>
        </select>

        <select id="racesFilter" aria-label="Races this season">
          <option value="">Races: any</option>
          <option value="none">No races this season</option>
          <option value="some">One or more races</option>
        </select>

        <label class="check">
          <input type="checkbox" id="multiOnly" /> Multi-team only
        </label>

        <label class="check" id="mismatchWrap" hidden>
          <input type="checkbox" id="mismatchOnly" /> Category mismatch only
        </label>

        <label class="check">
          <input type="checkbox" id="groupByTeam" checked /> Group by team
        </label>

        <button id="reset">Reset</button>
      </section>

      <div class="result-count" id="count"></div>

      <div class="table-wrap">
        <table id="table">
          <thead>
            <tr id="head"></tr>
          </thead>
          <tbody id="body"></tbody>
        </table>
      </div>
    </main>

    <footer>
      <span id="version"></span>
      <span>zwid links open ZwiftPower · JSON/CSV exports live in the toolbar popup</span>
    </footer>

    <script src="report-format.js"></script>
    <script src="nav.js"></script>
    <script src="race-format.js"></script>
    <script src="zr-format.js"></script>
    <script type="module" src="results.js"></script>
  </body>
</html>
